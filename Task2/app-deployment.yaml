apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-deployment
  template:
    metadata:
      labels:
        app: app-deployment
    spec:
      containers:
        - name: insuretech-app-container
          image: shestera/scaletestapp
          resources:
            limits:
              memory: "30Mi"
            requests:
              memory: "20Mi"
          ports:
            - containerPort: 8080